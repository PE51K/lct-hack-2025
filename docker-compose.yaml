services:
  test-clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: test-clickhouse
    restart: unless-stopped
    networks:
      - app-network
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${TEST_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${TEST_CLICKHOUSE_PASSWORD}
    volumes:
      - ${TEST_CLICKHOUSE_DATA_VOLUME}:/var/lib/clickhouse
      - ${TEST_CLICKHOUSE_LOGS_VOLUME}:/var/log/clickhouse-server
      - ./test_dbs/test_data/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${TEST_CLICKHOUSE_HTTP_PORT}:8123"
      - "${TEST_CLICKHOUSE_NATIVE_PORT}:9000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test-postgres:
    image: postgres:17-alpine
    container_name: test-postgres
    restart: unless-stopped
    networks:
      - app-network
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "${TEST_POSTGRES_PORT}:5432"
    volumes:
      - ${TEST_POSTGRES_VOLUME}:/var/lib/postgresql/data
      - ./test_dbs/test_data/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  test-minio:
    image: minio/minio:latest
    container_name: test-minio
    restart: unless-stopped
    networks:
      - app-network
    command: ["minio", "server", "--address", ":9000", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_ROOT_PASSWORD}
    ports:
      - "${TEST_MINIO_PORT}:9000"
      - "${TEST_MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ${TEST_MINIO_VOLUME}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  test-minio-init:
    build:
      context: ./test_dbs
      dockerfile: dockerfile
    container_name: test-minio-init
    networks:
      - app-network
    environment:
      TEST_MINIO_ROOT_USER: ${TEST_MINIO_ROOT_USER}
      TEST_MINIO_ROOT_PASSWORD: ${TEST_MINIO_ROOT_PASSWORD}
      TEST_MINIO_HOST: test-minio
      TEST_MINIO_PORT: 9000
    depends_on:
      test-minio:
        condition: service_healthy
    restart: "no"

  airflow-postgres:
    image: postgres:17-alpine
    container_name: airflow-postgres
    restart: unless-stopped
    networks:
      - app-network
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    ports:
      - "${AIRFLOW_POSTGRES_PORT}:5432"
    volumes:
      - ${AIRFLOW_POSTGRES_VOLUME}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  airflow:
    image: apache/airflow:2.8.0
    container_name: airflow
    user: "50000:0"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__RBAC: 'true'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 5
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__CORE__LAZY_LOAD_PLUGINS: 'false'
    volumes:
      - ${AIRFLOW_DAGS_VOLUME}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_VOLUME}:/opt/airflow/logs
    ports:
      - "${AIRFLOW_PORT}:8080"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true &&
      airflow scheduler &
      airflow webserver
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend
    restart: unless-stopped
    networks:
      - app-network
    environment:
      APP_PORT: ${APP_PORT}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS}
      APP_CORS_ALLOW_CREDENTIALS: ${APP_CORS_ALLOW_CREDENTIALS}
      APP_CORS_ALLOW_METHODS: ${APP_CORS_ALLOW_METHODS}
      APP_CORS_ALLOW_HEADERS: ${APP_CORS_ALLOW_HEADERS}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      YANDEX_GPT_API_KEY: ${YANDEX_GPT_API_KEY}
      YANDEX_GPT_BASE_URL: ${YANDEX_GPT_BASE_URL}
      YANDEX_GPT_FOLDER_ID: ${YANDEX_GPT_FOLDER_ID}
      YANDEX_GPT_MODEL: ${YANDEX_GPT_MODEL}
      YANDEX_GPT_MODEL_VERSION: ${YANDEX_GPT_MODEL_VERSION}
      AIRFLOW_POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      AIRFLOW_POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      AIRFLOW_POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
      AIRFLOW_POSTGRES_PORT: ${AIRFLOW_POSTGRES_PORT}
      AIRFLOW_FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_PORT: ${AIRFLOW_PORT}
      AIRFLOW_WEBSERVER_URL: ${AIRFLOW_WEBSERVER_URL}
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - ${AIRFLOW_DAGS_VOLUME}:/app/dags
    depends_on:
      test-postgres:
        condition: service_healthy
      test-clickhouse:
        condition: service_healthy
      test-minio:
        condition: service_healthy
      airflow:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: frontend
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge
    name: lct-hack-network
