services:
  test-clickhouse:
    image: clickhouse/clickhouse-server
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${TEST_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${TEST_CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - ${TEST_CLICKHOUSE_DATA_VOLUME}:/var/lib/clickhouse
      - ${TEST_CLICKHOUSE_LOGS_VOLUME}:/var/log/clickhouse-server
      - ./test_data/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${TEST_CLICKHOUSE_HTTP_PORT:-8124}:8123"
      - "${TEST_CLICKHOUSE_NATIVE_PORT:-9001}:9000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  test-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-sample}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${TEST_POSTGRES_VOLUME}:/var/lib/postgresql/data
      - ./test_data/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10

  test-zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  test-kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - test-zookeeper
    ports:
      - "${TEST_KAFKA_PORT:-9093}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: test-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,PLAINTEXT_INTERNAL://test-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  test-airflow-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${TEST_AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${TEST_AIRFLOW_POSTGRES_DB:-airflow}
    ports:
      - "${TEST_AIRFLOW_POSTGRES_PORT:-5434}:5432"
    volumes:
      - ${TEST_AIRFLOW_POSTGRES_VOLUME}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_AIRFLOW_POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10

  test-airflow:
    image: apache/airflow:2.8.0
    user: root
    restart: unless-stopped
    depends_on:
      test-airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${TEST_AIRFLOW_POSTGRES_USER}:${TEST_AIRFLOW_POSTGRES_PASSWORD}@test-airflow-postgres:5432/${TEST_AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${TEST_AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__RBAC: 'true'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
    ports:
      - "${TEST_AIRFLOW_PORT:-8081}:8080"
    volumes:
      - ${TEST_AIRFLOW_DAGS_VOLUME}:/opt/airflow/dags
      - ${TEST_AIRFLOW_LOGS_VOLUME}:/opt/airflow/logs
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com ||
      echo 'User already exists' &&
      airflow webserver
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
 
    test-minio:
      image: minio/minio
      restart: unless-stopped
      entrypoint: sh
      command: -c 'mkdir -p /data/test && minio server --address ":9000" --console-address ":9001" /data'
      environment:
        MINIO_ROOT_USER: ${TEST_MINIO_ROOT_USER:-minio}
        MINIO_ROOT_PASSWORD: ${TEST_MINIO_ROOT_PASSWORD:-miniosecret}
      ports:
        - "${TEST_MINIO_PORT:-9002}:9000"
        - "${TEST_MINIO_CONSOLE_PORT:-9003}:9001"
      volumes:
        - ${TEST_MINIO_VOLUME}:/data
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
        interval: 1s
        timeout: 5s
        retries: 5
        start_period: 1s
 
    test-minio-init:
      image: python:3.12-slim
      depends_on:
        test-minio:
          condition: service_healthy
      environment:
        TEST_MINIO_ROOT_USER: ${TEST_MINIO_ROOT_USER:-minio}
        TEST_MINIO_ROOT_PASSWORD: ${TEST_MINIO_ROOT_PASSWORD:-miniosecret}
        TEST_MINIO_HOST: test-minio
      volumes:
        - .:/app
      working_dir: /app
      command: >
        sh -c "
        pip install boto3 &&
        python init_test_dbs.py
        "
      restart: "no"

      