[project]
name = "test-dbs"
version = "0.1.0"
description = "Test databases initialization script"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
clickhouse = ["clickhouse-driver>=0.2.0"]
all = ["test-dbs[postgres,clickhouse]"]
