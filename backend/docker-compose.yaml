include:
  - path: "docker-compose.airflow.yaml"
    env_file: ".env"

services:
  backend:
    build:
      context: .
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${AIRFLOW_DAGS_VOLUME:-./dags}:/app/dags
    ports:
      - ${APP_PORT:-8000}:8000
    restart: unless-stopped
